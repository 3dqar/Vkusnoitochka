<!DOCTYPE html>
<html lang="lt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NS40 — Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Bowlby+One&family=Permanent+Marker&family=Special+Elite&display=swap" rel="stylesheet">
<style>
  /* ══ ZINE THEME — admin ══ */
  :root {
    --paper:#ebe4d1; --paper-hi:#f7f2e4; --ink:#141210; --ink-soft:rgba(20,18,16,.62);
    --red:#e5322d; --yellow:#ffe94d; --pink:#ff6fb0; --green:#1d8a4e;
    --f-display:'Bowlby One','Arial Black',Impact,sans-serif;
    --f-marker:'Permanent Marker','Comic Sans MS',cursive;
    --f-type:'Special Elite','Courier New',monospace;
    --f-cond:'Anton',Impact,'Arial Narrow',sans-serif;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: var(--f-type); color: var(--ink); min-height: 100vh;
    background-color: var(--paper);
    background-image: radial-gradient(rgba(20,18,16,.10) 1px, transparent 1.4px);
    background-size: 7px 7px;
  }
  ::selection { background: var(--yellow); color: var(--ink); }
  body::before {
    content:''; position:fixed; inset:0; z-index:99990; pointer-events:none;
    background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3CfeColorMatrix type='saturate' values='0'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    opacity:.16; mix-blend-mode:multiply;
  }

  /* LOGIN */
  #loginScreen {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: 100vh; gap: 22px; padding: 20px;
  }
  .login-title { font-family: var(--f-display); font-size: clamp(1.8rem,7vw,2.6rem); color: var(--ink); text-shadow: .05em .05em 0 var(--red); rotate: -2deg; }
  .login-sub { font-family: var(--f-cond); font-size: .9rem; letter-spacing: .3em; color: var(--paper-hi); background: var(--ink); padding: 5px 16px 4px 22px; rotate: 1deg; }
  #pwInput {
    font-family: var(--f-type); font-size: 1rem; letter-spacing: .2em; text-align: center;
    background: var(--paper-hi); border: 2.5px solid var(--ink); box-shadow: 4px 4px 0 var(--ink);
    color: var(--ink); padding: 12px 24px; border-radius: 0; outline: none; width: 280px; max-width: 90vw;
    transition: all .15s;
  }
  #pwInput:focus { background: #fffbd1; box-shadow: 6px 6px 0 var(--red); }
  .login-btn {
    font-family: var(--f-cond); font-size: 1rem; letter-spacing: .22em;
    color: #fff; background: var(--red); border: 2.5px solid var(--ink); box-shadow: 4px 4px 0 var(--ink);
    padding: 10px 34px 9px; cursor: pointer; transition: all .12s;
  }
  .login-btn:hover { transform: translate(-2px,-2px); box-shadow: 6px 6px 0 var(--ink); }
  .login-btn:active { transform: translate(3px,3px); box-shadow: 1px 1px 0 var(--ink); }
  #loginError { color: var(--red); font-family: var(--f-marker); font-size: .95rem; letter-spacing: .08em; min-height: 22px; }

  /* ADMIN PANEL */
  #adminPanel { display: none; max-width: 800px; margin: 0 auto; padding: 30px 20px 80px; position: relative; z-index: 2; }

  .admin-header { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 14px; margin-bottom: 32px; }
  .admin-title { font-family: var(--f-display); font-size: clamp(1.1rem,4vw,1.5rem); color: var(--ink); background: linear-gradient(transparent 55%, var(--yellow) 55%); padding: 0 8px; rotate: -1.5deg; letter-spacing: .02em; }
  .header-btns { display: flex; gap: 12px; flex-wrap: wrap; }

  .back-btn {
    font-family: var(--f-cond); font-size: .85rem; letter-spacing: .16em;
    color: var(--ink); border: 2.5px solid var(--ink); background: var(--paper-hi);
    padding: 8px 18px 7px; cursor: pointer; text-decoration: none; box-shadow: 3px 3px 0 var(--ink); transition: all .12s;
  }
  .back-btn:hover { background: var(--yellow); transform: translate(-2px,-2px); box-shadow: 5px 5px 0 var(--ink); }

  .save-btn {
    font-family: var(--f-cond); font-size: .9rem; letter-spacing: .16em;
    color: #fff; background: var(--red); border: 2.5px solid var(--ink); box-shadow: 4px 4px 0 var(--ink);
    padding: 8px 22px 7px; cursor: pointer; transition: all .12s;
  }
  .save-btn:hover { transform: translate(-2px,-2px); box-shadow: 6px 6px 0 var(--ink); }
  .save-btn:active { transform: translate(3px,3px); box-shadow: 1px 1px 0 var(--ink); }
  .save-btn:disabled { opacity: .5; cursor: not-allowed; transform: none; box-shadow: 4px 4px 0 var(--ink); }

  .status-msg { font-family: var(--f-marker); font-size: .95rem; letter-spacing: .08em; text-align: center; min-height: 24px; margin-bottom: 16px; }
  .status-msg.ok    { color: var(--green); }
  .status-msg.err   { color: var(--red); }
  .status-msg.info  { color: var(--ink-soft); animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{opacity:.5} 50%{opacity:1} }

  /* TABLE */
  .table-wrap { background: var(--paper-hi); border: 2.5px solid var(--ink); box-shadow: 7px 7px 0 var(--ink); overflow: hidden; margin-bottom: 24px; }
  .table-head { display: grid; grid-template-columns: 40px 1fr 120px 44px; gap: 0; background: var(--ink); padding: 12px 16px; }
  .th { font-family: var(--f-cond); font-size: .8rem; letter-spacing: .25em; color: var(--paper-hi); text-transform: uppercase; }

  .flavour-row { display: grid; grid-template-columns: 40px 1fr 120px 44px; gap: 0; align-items: center; padding: 8px 16px; border-bottom: 1.5px dashed rgba(20,18,16,.3); transition: background .15s; }
  .flavour-row:last-child { border-bottom: none; }
  .flavour-row:hover { background: rgba(255,233,77,.3); }
  .row-num { font-family: var(--f-marker); font-size: .85rem; color: var(--ink-soft); }

  .name-input, .qty-input {
    background: transparent; border: 1.5px solid transparent;
    color: var(--ink); font-family: var(--f-type); font-size: 1rem; font-weight: 700;
    padding: 6px 10px; border-radius: 0; outline: none; transition: all .15s; width: 100%;
  }
  .name-input:focus, .qty-input:focus { border-color: var(--ink); background: #fffbd1; }
  .qty-input { font-family: var(--f-display); font-size: .95rem; font-weight: 400; text-align: center; width: 80px; }
  .qty-input.zero { color: var(--ink-soft); }
  .qty-input.low  { color: var(--red); }
  .qty-input.ok   { color: var(--green); }

  .del-btn { width: 30px; height: 30px; border: 2px solid var(--ink); background: var(--paper-hi); color: var(--red); font-family: var(--f-cond); font-size: 1.1rem; line-height: 1; cursor: pointer; transition: all .12s; display: flex; align-items: center; justify-content: center; }
  .del-btn:hover { background: var(--red); color: #fff; }

  /* ADD ROW */
  .add-row { display: flex; gap: 12px; align-items: center; padding: 18px 16px; flex-wrap: wrap; border-top: 2.5px solid var(--ink); background: rgba(20,18,16,.04); }
  .add-name { flex: 1; min-width: 160px; background: #fff; border: 2px solid var(--ink); color: var(--ink); font-family: var(--f-type); font-size: 1rem; padding: 9px 14px; border-radius: 0; outline: none; transition: all .15s; }
  .add-name:focus { background: #fffbd1; box-shadow: 3px 3px 0 var(--ink); }
  .add-name::placeholder { color: rgba(20,18,16,.4); }
  .add-qty { width: 80px; background: #fff; border: 2px solid var(--ink); color: var(--ink); font-family: var(--f-display); font-size: .9rem; text-align: center; padding: 9px 8px; border-radius: 0; outline: none; transition: all .15s; }
  .add-qty:focus { background: #fffbd1; box-shadow: 3px 3px 0 var(--ink); }
  .add-btn { font-family: var(--f-cond); font-size: .85rem; letter-spacing: .16em; color: var(--ink); border: 2.5px solid var(--ink); background: var(--yellow); box-shadow: 3px 3px 0 var(--ink); padding: 8px 20px 7px; cursor: pointer; transition: all .12s; white-space: nowrap; }
  .add-btn:hover { transform: translate(-2px,-2px); box-shadow: 5px 5px 0 var(--ink); }
  .add-btn:active { transform: translate(2px,2px); box-shadow: 1px 1px 0 var(--ink); }

  .hint { font-size: .85rem; letter-spacing: .08em; color: var(--ink-soft); text-align: center; padding: 0 16px 16px; line-height: 1.7; }
  .hint a { color: var(--red); text-decoration: underline wavy; text-underline-offset: 4px; }
  .hint a:hover { background: var(--yellow); color: var(--ink); }
  ::-webkit-scrollbar{width:10px} ::-webkit-scrollbar-track{background:var(--paper)} ::-webkit-scrollbar-thumb{background:var(--ink);border:2px solid var(--paper)}
  @media(max-width:480px){.table-head,.flavour-row{grid-template-columns:26px 1fr 76px 36px;padding-left:10px;padding-right:10px}.qty-input{width:62px;padding:6px 4px}.name-input{padding:6px 6px}}
  @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:0.01ms !important;animation-iteration-count:1 !important}}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginScreen">
  <div class="login-title">NS40 ADMIN</div>
  <div class="login-sub">ĮVESK SLAPTAŽODĮ</div>
  <input id="pwInput" type="password" placeholder="••••••••" autocomplete="current-password" />
  <button class="login-btn" id="loginBtn">PRISIJUNGTI</button>
  <div id="loginError"></div>
</div>

<!-- ADMIN -->
<div id="adminPanel">
  <div class="admin-header">
    <div class="admin-title">◈ NS40 ADMIN ◈</div>
    <div class="header-btns">
      <a href="index.html" class="back-btn">← PUSLAPIS</a>
      <button class="save-btn" id="saveBtn">💾 IŠSAUGOTI</button>
    </div>
  </div>

  <div class="status-msg" id="statusMsg"></div>

  <div class="table-wrap">
    <div class="table-head">
      <div class="th">#</div>
      <div class="th">Pavadinimas</div>
      <div class="th" style="text-align:center">Kiekis</div>
      <div class="th"></div>
    </div>
    <div id="rowsContainer"></div>
    <div class="add-row">
      <input class="add-name" id="addName" type="text" placeholder="Naujas skonis..." maxlength="60" />
      <input class="add-qty"  id="addQty"  type="number" min="0" max="999" value="0" />
      <button class="add-btn" id="addBtn">+ PRIDĖTI</button>
    </div>
  </div>

  <div class="hint">
    Pakeitimai išsaugomi tiesiai į tavo
    <a href="https://docs.google.com/spreadsheets/d/13rcjuyYF0pMCZJvFNtRLQECkv873dqIlAsR81G4ubMY" target="_blank">Google Sheet</a>
    per API. Puslapis atnaujinamas automatiškai.
  </div>
</div>

<script>
/* ── CONFIG ── */
const SHEET_ID  = '13rcjuyYF0pMCZJvFNtRLQECkv873dqIlAsR81G4ubMY';
const ADMIN_PW  = 'ns40admin'; // ← pakeisk slaptažodį čia

/* ── LOGIN ── */
document.getElementById('loginBtn').addEventListener('click', tryLogin);
document.getElementById('pwInput').addEventListener('keydown', e => { if(e.key==='Enter') tryLogin(); });

function tryLogin() {
  const pw = document.getElementById('pwInput').value;
  if (pw === ADMIN_PW) {
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('adminPanel').style.display  = 'block';
    loadData();
  } else {
    document.getElementById('loginError').textContent = '⚠ Neteisingas slaptažodis';
    document.getElementById('pwInput').value = '';
  }
}

/* ── DATA ── */
let rows = []; // [{name, qty}]

function parseCSV(text) {
  const lines = text.trim().split('\n').map(l=>l.trim()).filter(Boolean);
  if (lines.length < 2) return [];
  return lines.slice(1).map(line => {
    const cols = line.match(/(".*?"|[^,]+)(?=,|$)/g) || line.split(',');
    const name = (cols[0]||'').replace(/"/g,'').trim();
    const qty  = parseInt((cols[1]||'0').replace(/"/g,'').trim(), 10) || 0;
    return name ? {name, qty} : null;
  }).filter(Boolean);
}

async function loadData() {
  setStatus('Kraunama...', 'info');
  try {
    const res  = await fetch(`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&cachebust=${Date.now()}`);
    const text = await res.text();
    rows = parseCSV(text);
    renderRows();
    setStatus('✓ Duomenys įkelti', 'ok');
    setTimeout(()=>setStatus('',''), 2000);
  } catch(e) {
    setStatus('⚠ Nepavyko įkelti — patikrink ar Sheet\'as viešas', 'err');
  }
}

/* ── RENDER ROWS ── */
function renderRows() {
  const container = document.getElementById('rowsContainer');
  container.innerHTML = rows.map((r, i) => `
    <div class="flavour-row" id="row-${i}">
      <div class="row-num">${i+1}</div>
      <input class="name-input" data-i="${i}" data-field="name" value="${escHtml(r.name)}" maxlength="60" />
      <input class="qty-input ${qtyClass(r.qty)}" data-i="${i}" data-field="qty" type="number" min="0" max="999" value="${r.qty}" />
      <button class="del-btn" data-i="${i}" title="Ištrinti">×</button>
    </div>`).join('');

  container.querySelectorAll('.name-input').forEach(el => el.addEventListener('input', onFieldChange));
  container.querySelectorAll('.qty-input').forEach(el  => el.addEventListener('input', onFieldChange));
  container.querySelectorAll('.del-btn').forEach(el    => el.addEventListener('click', onDelete));
}

function onFieldChange(e) {
  const i     = parseInt(e.target.dataset.i);
  const field = e.target.dataset.field;
  if (field === 'name') { rows[i].name = e.target.value; }
  if (field === 'qty')  {
    rows[i].qty = parseInt(e.target.value, 10) || 0;
    e.target.className = 'qty-input ' + qtyClass(rows[i].qty);
  }
}

function onDelete(e) {
  const i = parseInt(e.target.dataset.i);
  if (confirm(`Ištrinti "${rows[i].name}"?`)) {
    rows.splice(i, 1);
    renderRows();
  }
}

function qtyClass(qty) { return qty===0?'zero':qty<=2?'low':'ok'; }
function escHtml(s) { return s.replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;'); }

/* ── ADD ── */
document.getElementById('addBtn').addEventListener('click', () => {
  const name = document.getElementById('addName').value.trim();
  const qty  = parseInt(document.getElementById('addQty').value, 10) || 0;
  if (!name) { document.getElementById('addName').focus(); return; }
  rows.push({ name, qty });
  renderRows();
  document.getElementById('addName').value = '';
  document.getElementById('addQty').value  = '0';
  document.getElementById('addName').focus();
});
document.getElementById('addName').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('addBtn').click();
});

const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwRHqxRdW5pOFLVaH841cwCMmksyBIfx77JFMwL8k_5lk_6PkiJjjb9xx197ZoW7XU/exec';

/* ── SAVE via Apps Script ── */
document.getElementById('saveBtn').addEventListener('click', saveData);

async function saveData() {
  const btn = document.getElementById('saveBtn');
  btn.disabled = true;
  setStatus('Saugojama...', 'info');
  try {
    await fetch(SCRIPT_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ rows })
    });
    setStatus('✓ Išsaugota! Puslapis atnaujintas.', 'ok');
    setTimeout(() => setStatus('', ''), 3000);
  } catch(e) {
    setStatus('⚠ Nepavyko išsaugoti', 'err');
  }
  btn.disabled = false;
}

function setStatus(msg, type) {
  const el = document.getElementById('statusMsg');
  el.textContent = msg;
  el.className = 'status-msg ' + (type||'');
}
</script>
</body>
</html>
