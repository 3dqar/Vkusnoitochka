<!doctype html>
<html lang="lt"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>3DQA — Arctic Winter</title><style>
:root{color-scheme:light;--ink:#173447;--muted:#557287;--ice:#e4eff6}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:system-ui,-apple-system,sans-serif;color:var(--ink);background:linear-gradient(160deg,#f9fcff,#d6e6f0);padding:24px}main{max-width:1050px;margin:auto}header{display:flex;justify-content:space-between;align-items:center;margin:10px 0 28px;font-weight:800;letter-spacing:.08em}small{font-weight:600;color:var(--muted)}.hero{position:relative;overflow:hidden;border-radius:32px;background:#c9dfeb;min-height:310px;padding:48px 36px;isolation:isolate}.hero svg{position:absolute;inset:0;width:100%;height:100%;z-index:-1;opacity:.65}.hero h1{font-size:clamp(52px,10vw,105px);line-height:1;margin:25px 0 8px;letter-spacing:-.09em}.hero p{font-size:20px;margin:0}.tag{font-size:12px;letter-spacing:.15em;font-weight:700}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin:22px 0}.card{background:#ffffffc9;border:1px solid white;border-radius:28px;padding:26px;box-shadow:0 12px 40px #40688012}.card h2{margin:0 0 16px;font-size:24px}.card p{color:var(--muted);line-height:1.6}input{width:100%;font:inherit;padding:13px;border:1px solid #cadce7;border-radius:14px;margin:6px 0 12px;background:#f9fcff;color:var(--ink)}.buttons{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}button{font:inherit;font-weight:650;border:0;border-radius:13px;padding:14px;background:#e5eff5;color:var(--ink);cursor:pointer}button:hover{background:#cddfea}button.primary{background:#173447;color:white}footer{font-size:13px;color:var(--muted);display:flex;justify-content:space-between;padding:18px 4px}.snow{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:4}.flake{position:absolute;top:-12px;background:white;border-radius:50%;animation:fall linear infinite}@keyframes fall{to{transform:translate(35px,110vh)}}@media(max-width:660px){body{padding:14px}.grid{grid-template-columns:1fr}.hero{padding:32px 24px;min-height:260px}}@media(prefers-reduced-motion:reduce){.snow{display:none}}
</style><main><header><span>3DQA.</span><small>ŽIEMA / 2026</small></header><section class="hero"><svg viewBox="0 0 1000 310" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><circle cx="800" cy="80" r="45" fill="#f5fafc"/><path d="M250 310L570 65 750 240 880 90 1050 310Z" fill="#a2bfd0"/><path d="M400 310L570 65 635 129 577 114 546 145 515 120Z M750 240L880 90 940 161 883 143 850 170Z" fill="#f3f8fc"/><path d="M0 290Q300 230 550 280T1100 245V310H0Z" fill="#f6fbff"/></svg><span class="tag">ARCTIC EDITION</span><h1>3DQA.</h1><p>Žiemos erdvė.</p></section><div class="grid"><section class="card"><h2>Skaičiuotuvas</h2><label for="a">Pirmas skaičius</label><input id="a" type="number" step="any" value="0"><label for="b">Antras skaičius</label><input id="b" type="number" step="any" value="0"><div class="buttons"><button data-op="+">+</button><button data-op="-">−</button><button data-op="*">×</button><button data-op="/">÷</button></div><p aria-live="polite">Rezultatas: <strong id="result">0</strong></p></section><section class="card"><span class="tag">NUSTATYMAI</span><h2>Žiemos atmosfera</h2><p>Ramus fonas, švelnūs atspalviai ir krintančios snaigės.</p><button class="primary" id="toggle" aria-pressed="true">Išjungti sniegą</button></section></div><footer><span>© 2026 3DQA</span><span>Arctic Winter</span></footer></main><div class="snow" id="snow" aria-hidden="true"></div><script>const snow=document.getElementById('snow');for(let i=0;i<32;i++){const f=document.createElement('i');f.className='flake';const size=2+Math.random()*5;Object.assign(f.style,{left:Math.random()*100+'%',width:size+'px',height:size+'px',opacity:.3+Math.random()*.6,animationDuration:8+Math.random()*12+'s',animationDelay:-Math.random()*20+'s'});snow.append(f)}document.getElementById('toggle').addEventListener('click',e=>{const on=!snow.hidden;snow.hidden=on;e.target.textContent=on?'Įjungti sniegą':'Išjungti sniegą';e.target.setAttribute('aria-pressed',String(!on))});document.querySelectorAll('[data-op]').forEach(btn=>btn.addEventListener('click',()=>{const a=document.getElementById('a').valueAsNumber,b=document.getElementById('b').valueAsNumber;const op=btn.dataset.op;const v=op==='+'?a+b:op==='-'?a-b:op==='*'?a*b:a/b;document.getElementById('result').textContent=Number.isFinite(v)?String(Number(v.toPrecision(12))):'Neteisinga reikšmė'}));</script></html>
