<!DOCTYPE html>
<html lang="lt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NS40 — Flappy Liquid</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Bowlby+One&family=Permanent+Marker&family=Special+Elite&display=swap" rel="stylesheet">
<style>
  /* ══ ZINE THEME — Flappy Liquid ══ */
  :root {
    --paper:#ebe4d1; --paper-hi:#f7f2e4; --ink:#141210; --ink-soft:rgba(20,18,16,.62);
    --red:#e5322d; --yellow:#ffe94d; --pink:#ff6fb0; --green:#1d8a4e;
    --f-display:'Bowlby One','Arial Black',Impact,sans-serif;
    --f-marker:'Permanent Marker','Comic Sans MS',cursive;
    --f-type:'Special Elite','Courier New',monospace;
    --f-cond:'Anton',Impact,'Arial Narrow',sans-serif;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: var(--f-type); color: var(--ink);
    background-color: var(--paper);
    background-image: radial-gradient(rgba(20,18,16,.10) 1px, transparent 1.4px);
    background-size: 7px 7px;
    min-height: 100vh; overflow-x: hidden;
    display: flex; flex-direction: column; align-items: center;
  }
  ::selection { background: var(--yellow); color: var(--ink); }
  #bgCanvas { display: none; }
  body::before {
    content:''; position:fixed; inset:0; z-index:99990; pointer-events:none;
    background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3CfeColorMatrix type='saturate' values='0'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    opacity:.16; mix-blend-mode:multiply;
  }
  #wrap {
    position: relative; z-index: 2;
    display: flex; flex-direction: column;
    align-items: center; gap: 16px;
    padding: 20px; width: 100%; max-width: 800px;
  }
  .back-btn {
    align-self: flex-start;
    display: inline-flex; align-items: center; gap: 8px;
    font-family: var(--f-cond); font-size: .85rem; letter-spacing: .2em;
    color: var(--ink); border: 2.5px solid var(--ink);
    background: var(--paper-hi); padding: 7px 18px 6px;
    cursor: pointer; text-decoration: none; box-shadow: 3px 3px 0 var(--ink); transition: all .12s;
  }
  .back-btn:hover { background: var(--yellow); transform: translate(-2px,-2px); box-shadow: 5px 5px 0 var(--ink); }
  .game-title {
    font-family: var(--f-display);
    font-size: clamp(1.8rem, 7vw, 3rem); font-weight: 400;
    color: var(--ink); text-shadow: .05em .05em 0 var(--red);
    letter-spacing: .02em; rotate: -2deg; margin: 6px 0;
  }
  #scoreDisplay {
    font-family: var(--f-marker); font-size: clamp(.9rem, 2.4vw, 1.1rem);
    color: var(--ink); letter-spacing: .15em;
    background: linear-gradient(transparent 55%, var(--yellow) 55%); padding: 0 8px;
  }

  .game-area {
    display: flex; gap: 32px; align-items: flex-start;
    width: 100%; justify-content: center; flex-wrap: wrap;
  }
  .game-col { display: flex; flex-direction: column; align-items: center; gap: 16px; }

  #gameCanvas {
    border: 3px solid var(--ink); border-radius: 0; display: block; background: var(--paper-hi);
    box-shadow: 7px 7px 0 var(--ink);
    width: min(360px, 90vw); cursor: pointer; touch-action: none;
  }
  #message {
    font-family: var(--f-marker); font-size: clamp(.85rem, 2.2vw, 1rem);
    color: var(--red); letter-spacing: .1em; text-align: center; min-height: 22px;
  }
  #startBtn {
    font-family: var(--f-cond); font-size: 1rem; letter-spacing: .25em;
    color: var(--ink); border: 2.5px solid var(--ink);
    background: var(--yellow); padding: 10px 32px 9px;
    cursor: pointer; transition: all .12s; box-shadow: 4px 4px 0 var(--ink);
  }
  #startBtn:hover { transform: translate(-2px,-2px); box-shadow: 6px 6px 0 var(--ink); }
  #startBtn:active { transform: translate(3px,3px); box-shadow: 1px 1px 0 var(--ink); }

  /* scoreboard */
  .scoreboard {
    position: relative;
    background: var(--paper-hi);
    border: 2.5px solid var(--ink); box-shadow: 6px 6px 0 var(--ink);
    padding: 26px 20px 20px; rotate: 1deg;
    width: min(300px, 90vw);
  }
  .scoreboard::before { content:''; position:absolute; top:-13px; left:50%; width:84px; height:24px; margin-left:-42px; background:rgba(255,111,176,.65); border:1px solid rgba(20,18,16,.15); rotate:-3deg; }
  .sb-title {
    font-family: var(--f-cond); font-size: 1.1rem;
    letter-spacing: .3em; color: var(--ink);
    text-align: center; margin-bottom: 16px;
  }
  .sb-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 10px; margin-bottom: 6px;
    border-bottom: 1.5px dashed rgba(20,18,16,.35);
    transition: all .2s;
  }
  .sb-row:nth-child(1) { background: rgba(255,233,77,.55); border-bottom-style: solid; border-bottom-color: var(--ink); }
  .sb-row:nth-child(2) { background: rgba(20,18,16,.08); }
  .sb-row:nth-child(3) { background: rgba(229,50,45,.12); }
  .sb-rank {
    font-family: var(--f-marker); font-size: .85rem;
    color: var(--ink-soft); width: 28px;
  }
  .sb-row:nth-child(1) .sb-rank,
  .sb-row:nth-child(2) .sb-rank,
  .sb-row:nth-child(3) .sb-rank { color: var(--ink); }
  .sb-name {
    flex: 1; font-family: var(--f-type); font-size: 1rem;
    font-weight: 700; color: var(--ink); padding: 0 10px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .sb-score {
    font-family: var(--f-display); font-size: .9rem;
    color: var(--red); letter-spacing: .05em;
  }
  .sb-empty {
    text-align: center; color: var(--ink-soft);
    font-size: .95rem; letter-spacing: .1em;
    padding: 20px 0; font-family: var(--f-marker);
  }
  .sb-loading {
    text-align: center; color: var(--ink-soft);
    font-size: .95rem; letter-spacing: .1em;
    padding: 20px 0; font-family: var(--f-marker);
    animation: textPulse 1.2s ease-in-out infinite;
  }
  @keyframes textPulse { 0%,100%{opacity:.4} 50%{opacity:1} }

  /* name modal */
  #nameModal {
    display: none; position: fixed; inset: 0; z-index: 100;
    background: rgba(20,18,16,.92);
    align-items: center; justify-content: center;
    flex-direction: column; gap: 22px;
  }
  #nameModal.show { display: flex; }
  .modal-title {
    font-family: var(--f-marker); font-size: clamp(1rem, 3vw, 1.3rem);
    letter-spacing: .2em; color: var(--ink); background: var(--yellow);
    padding: 3px 16px; rotate: -2deg;
  }
  .modal-score {
    font-family: var(--f-display); font-size: 3.2rem;
    color: var(--paper-hi); text-shadow: 4px 4px 0 var(--red);
  }
  #nameInput {
    font-family: var(--f-type); font-size: 1rem;
    letter-spacing: .15em; text-align: center;
    background: var(--paper-hi);
    border: 3px solid var(--paper-hi); box-shadow: 5px 5px 0 var(--red);
    color: var(--ink); padding: 12px 24px; border-radius: 0;
    outline: none; width: 260px; max-width: 90vw;
  }
  #nameInput:focus { background: #fffbd1; }
  #nameInput::placeholder { color: rgba(20,18,16,.4); }
  #submitScore {
    font-family: var(--f-cond); font-size: 1rem; letter-spacing: .25em;
    color: #fff; border: 2.5px solid var(--paper-hi);
    background: var(--red); padding: 10px 34px 9px;
    cursor: pointer; transition: all .12s; box-shadow: 4px 4px 0 var(--paper-hi);
  }
  #submitScore:hover { transform: translate(-2px,-2px); box-shadow: 6px 6px 0 var(--paper-hi); }
  #skipScore {
    font-family: var(--f-type); font-size: .85rem; letter-spacing: .15em;
    color: rgba(247,242,228,.7); background: none; border: none; cursor: pointer;
    text-decoration: underline;
  }
  #skipScore:hover { color: var(--yellow); }
  @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:0.01ms !important;animation-iteration-count:1 !important}}
</style>
</head>
<body>
<canvas id="bgCanvas"></canvas>

<!-- Name entry modal -->
<div id="nameModal">
  <div class="modal-title">NAUJAS REKORDAS</div>
  <div class="modal-score" id="modalScore">0</div>
  <input id="nameInput" type="text" maxlength="16" placeholder="TAVO SLAPYVARDIS" autocomplete="off" />
  <button id="submitScore">ĮRAŠYTI</button>
  <button id="skipScore">praleisti</button>
</div>

<div id="wrap">
  <a href="index.html" class="back-btn">← GRĮŽTI</a>
  <div class="game-title">FLAPPY LIQUID</div>
  <div id="scoreDisplay">SCORE: 0 &nbsp;|&nbsp; BEST: 0</div>

  <div class="game-area">
    <div class="game-col">
      <canvas id="gameCanvas" width="360" height="520"></canvas>
      <div id="message">SPAUSK TARPĄ ARBA PALIESKI</div>
      <button id="startBtn">PRADĖTI</button>
    </div>

    <div class="scoreboard" id="scoreboard">
      <div class="sb-title">◈ TOP 10 ◈</div>
      <div class="sb-loading" id="sbContent">KRAUNAMA...</div>
    </div>
  </div>
</div>

<script>
/* ── CONFIG ── */
const MASTER_KEY = '$2a$10$sqxrNcDL8gGRdgJ0gHC.FuBsgJ/X9ecKlK4IOr87zMVxB9R1cb3IO';
const BIN_NAME   = 'ns40-flappy-scores';
let   BIN_ID     = localStorage.getItem('ns40_bin_id') || null;

/* ── JSONBIN API ── */
async function loadScores() {
  try {
    if (!BIN_ID) { await createBin(); return []; }
    const r = await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}/latest`, {
      headers: { 'X-Master-Key': MASTER_KEY }
    });
    const d = await r.json();
    return d.record.scores || [];
  } catch(e) { return []; }
}

async function createBin() {
  try {
    const r = await fetch('https://api.jsonbin.io/v3/b', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'X-Master-Key': MASTER_KEY,
        'X-Bin-Name':   BIN_NAME,
        'X-Bin-Private':'false'
      },
      body: JSON.stringify({ scores: [] })
    });
    const d = await r.json();
    BIN_ID = d.metadata.id;
    localStorage.setItem('ns40_bin_id', BIN_ID);
  } catch(e) {}
}

async function saveScore(name, pts) {
  try {
    let scores = await loadScores();
    scores.push({ name: name.toUpperCase(), score: pts, date: new Date().toLocaleDateString('lt-LT') });
    scores.sort((a,b) => b.score - a.score);
    scores = scores.slice(0, 10);
    await fetch(`https://api.jsonbin.io/v3/b/${BIN_ID}`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json', 'X-Master-Key': MASTER_KEY },
      body: JSON.stringify({ scores })
    });
    renderScoreboard(scores);
  } catch(e) {}
}

async function renderScoreboardFromAPI() {
  const scores = await loadScores();
  renderScoreboard(scores);
}

function renderScoreboard(scores) {
  const el = document.getElementById('sbContent');
  if (!scores.length) {
    el.outerHTML = '<div class="sb-empty" id="sbContent">DAR NĖRA REZULTATŲ</div>';
    return;
  }
  const medals = ['🥇','🥈','🥉'];
  el.outerHTML = '<div id="sbContent">' + scores.map((s,i) => `
    <div class="sb-row">
      <span class="sb-rank">${medals[i] || '#'+(i+1)}</span>
      <span class="sb-name">${s.name}</span>
      <span class="sb-score">${s.score}</span>
    </div>
  `).join('') + '</div>';
}

/* ── BG particles ── */
const bgC=document.getElementById('bgCanvas'),bgX=bgC.getContext('2d');
function resizeBg(){bgC.width=innerWidth;bgC.height=innerHeight;}
resizeBg();addEventListener('resize',resizeBg);
const CLR=['#00f5ff','#bf00ff','#ff0080','#0057ff'];
const pts=Array.from({length:55},()=>({x:Math.random()*innerWidth,y:Math.random()*innerHeight,r:Math.random()*1.4+0.3,vx:(Math.random()-.5)*.3,vy:(Math.random()-.5)*.3-.12,c:CLR[Math.floor(Math.random()*4)],a:Math.random()*.5+.2,p:Math.random()*Math.PI*2}));
(function bgLoop(){bgX.clearRect(0,0,bgC.width,bgC.height);pts.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.p+=.04;if(p.y<-10){p.y=bgC.height+10;p.x=Math.random()*bgC.width;}if(p.x<-10)p.x=bgC.width+10;if(p.x>bgC.width+10)p.x=-10;bgX.save();bgX.beginPath();bgX.arc(p.x,p.y,p.r,0,Math.PI*2);bgX.shadowBlur=10;bgX.shadowColor=p.c;bgX.globalAlpha=p.a*(.6+.4*Math.sin(p.p));bgX.fillStyle=p.c;bgX.fill();bgX.restore();});requestAnimationFrame(bgLoop);})();

/* ── GAME ── */
const canvas=document.getElementById('gameCanvas');
const ctx=canvas.getContext('2d');
const scoreEl=document.getElementById('scoreDisplay');
const msgEl=document.getElementById('message');
const btn=document.getElementById('startBtn');
const W=360,H=520,GRAV=0.45,FLAPV=-8,PW=54,GAP=148,SPD=2.6;
let bird,pipes=[],score=0,best=0,frame=0,state='idle';

function newBird(){return{x:80,y:H/2,vy:0,r:16};}

function onInput(){
  if(state==='idle'||state==='dead'){startGame();}
  else if(state==='playing'){bird.vy=FLAPV;}
}

function startGame(){
  bird=newBird();pipes=[];score=0;frame=0;state='playing';
  btn.style.display='none';msgEl.textContent='';
  requestAnimationFrame(gameLoop);
}

function gameDie(){
  state='dead';
  msgEl.textContent='GAME OVER — SPAUSK TARPĄ';
  btn.textContent='BANDYTI VĖL';
  btn.style.display='inline-block';
  render();
  if(score > 0) showNameModal(score);
}

function gameLoop(){
  if(state!=='playing')return;
  frame++;
  bird.vy+=GRAV;bird.y+=bird.vy;
  if(frame%90===0)pipes.push({x:W,topH:80+Math.random()*(H-GAP-160),scored:false});
  for(let p of pipes){
    p.x-=SPD;
    if(!p.scored&&p.x+PW<bird.x){p.scored=true;score++;if(score>best)best=score;scoreEl.textContent='SCORE: '+score+'  |  BEST: '+best;}
    if(bird.x+bird.r-5>p.x&&bird.x-bird.r+5<p.x+PW&&(bird.y-bird.r+4<p.topH||bird.y+bird.r-4>p.topH+GAP)){gameDie();return;}
  }
  pipes=pipes.filter(p=>p.x+PW>-5);
  if(bird.y-bird.r<0||bird.y+bird.r>H){gameDie();return;}
  render();
  requestAnimationFrame(gameLoop);
}

function render(){
  ctx.fillStyle='#f4eedd';ctx.fillRect(0,0,W,H);
  ctx.save();
  let g=ctx.createRadialGradient(W*.2,H*.3,0,W*.2,H*.3,W*.7);
  g.addColorStop(0,'rgba(36,71,216,0.06)');g.addColorStop(1,'transparent');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  g=ctx.createRadialGradient(W*.8,H*.7,0,W*.8,H*.7,W*.6);
  g.addColorStop(0,'rgba(229,50,45,0.07)');g.addColorStop(1,'transparent');
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.restore();
  ctx.strokeStyle='rgba(20,18,16,0.09)';ctx.lineWidth=1;
  for(let y=0;y<H;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
  for(let x=0;x<W;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
  pipes.forEach(p=>{
    const gr=ctx.createLinearGradient(p.x,0,p.x+PW,0);
    gr.addColorStop(0,'#e3d9b8');gr.addColorStop(.45,'#ffe94d');gr.addColorStop(1,'#e3d9b8');
    ctx.fillStyle=gr;ctx.beginPath();ctx.rect(p.x,0,PW,p.topH);ctx.fill();
    ctx.strokeStyle='#141210';ctx.lineWidth=3;ctx.stroke();
    ctx.fillStyle=gr;ctx.beginPath();ctx.rect(p.x,p.topH+GAP,PW,H-p.topH-GAP);ctx.fill();
    ctx.strokeStyle='#141210';ctx.lineWidth=3;ctx.stroke();
    ctx.strokeStyle='rgba(229,50,45,0.6)';ctx.lineWidth=1.5;ctx.setLineDash([4,6]);
    ctx.beginPath();ctx.moveTo(p.x+PW/2,p.topH);ctx.lineTo(p.x+PW/2,p.topH+GAP);ctx.stroke();ctx.setLineDash([]);
  });
  if(bird){
    ctx.save();ctx.translate(bird.x,bird.y);
    ctx.rotate(Math.max(-.5,Math.min(.5,bird.vy*.05)));
    ctx.shadowBlur=0;
    const bg=ctx.createRadialGradient(-4,-4,2,0,0,bird.r);
    bg.addColorStop(0,'#ff7a74');bg.addColorStop(1,'#e5322d');
    ctx.beginPath();ctx.arc(0,0,bird.r,0,Math.PI*2);ctx.fillStyle=bg;ctx.fill();
    ctx.shadowBlur=0;ctx.strokeStyle='#141210';ctx.lineWidth=2.5;ctx.stroke();
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(5,-4,5,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#141210';ctx.beginPath();ctx.arc(6,-4,3,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(7,-5,1,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#ff9d00';ctx.beginPath();ctx.moveTo(14,0);ctx.lineTo(22,-3);ctx.lineTo(22,3);ctx.closePath();ctx.fill();
    ctx.restore();
  }
  if(state==='idle'){
    ctx.textAlign='center';
    ctx.font="32px Impact,'Arial Black',sans-serif";
    ctx.fillStyle='#141210';
    ctx.fillText('NS40',W/2,H/2-18);
    ctx.font="bold 14px 'Courier New',monospace";ctx.fillStyle='#e5322d';
    ctx.fillText('FLAPPY LIQUID',W/2,H/2+12);
    ctx.font="11px 'Courier New',monospace";ctx.fillStyle='rgba(20,18,16,0.55)';
    ctx.fillText('SPAUSK TARPĄ ARBA PALIESKI',W/2,H/2+42);
  }
}

/* ── NAME MODAL ── */
function showNameModal(pts) {
  document.getElementById('modalScore').textContent = pts;
  document.getElementById('nameInput').value = '';
  document.getElementById('nameModal').classList.add('show');
  setTimeout(()=>document.getElementById('nameInput').focus(), 100);
}
function hideModal() {
  document.getElementById('nameModal').classList.remove('show');
}

document.getElementById('submitScore').addEventListener('click', async () => {
  const name = document.getElementById('nameInput').value.trim();
  if (!name) return;
  hideModal();
  await saveScore(name, score);
});
document.getElementById('nameInput').addEventListener('keydown', async e => {
  if (e.key === 'Enter') {
    const name = document.getElementById('nameInput').value.trim();
    if (!name) return;
    hideModal();
    await saveScore(name, score);
  }
});
document.getElementById('skipScore').addEventListener('click', hideModal);

/* ── INIT ── */
bird = newBird();
render();
renderScoreboardFromAPI();

/* ── CONTROLS ── */
document.addEventListener('keydown', e => {
  if (e.code === 'Space') {
    if (document.getElementById('nameModal').classList.contains('show')) return;
    e.preventDefault(); onInput();
  }
});
canvas.addEventListener('pointerdown', e => { e.preventDefault(); onInput(); });
btn.addEventListener('click', onInput);
</script>
</body>
</html>
