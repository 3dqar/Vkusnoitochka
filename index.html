<!DOCTYPE html>
<html lang="lt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NS40 — Premium Liquid Skoniai</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="favicon.ico">
<meta name="theme-color" content="#ebe4d1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="NS40">
<link rel="apple-touch-icon" href="icon-152x152.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Bowlby+One&family=Permanent+Marker&family=Special+Elite&display=swap" rel="stylesheet">
<style>
  /* ══ ZINE THEME — papier, tusz, taśma, ksero ══ */
  :root {
    --paper:#ebe4d1; --paper-hi:#f7f2e4; --ink:#141210; --ink-soft:rgba(20,18,16,.62);
    --red:#e5322d; --yellow:#ffe94d; --pink:#ff6fb0; --blue:#2447d8; --green:#1d8a4e;
    --f-display:'Bowlby One','Arial Black',Impact,sans-serif;
    --f-marker:'Permanent Marker','Comic Sans MS',cursive;
    --f-type:'Special Elite','Courier New',monospace;
    --f-cond:'Anton',Impact,'Arial Narrow',sans-serif;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: var(--f-type);
    background-color: var(--paper);
    background-image: radial-gradient(rgba(20,18,16,.10) 1px, transparent 1.4px);
    background-size: 7px 7px;
    color: var(--ink);
    min-height: 100vh; overflow-x: hidden;
  }
  ::selection { background: var(--yellow); color: var(--ink); }

  /* neonowy kursor i canvas wyłączone — zin ma zwykły kursor */
  #cursor, .trail { display: none !important; }
  #bgCanvas { display: none; }

  /* ziarno ksero na całej stronie */
  body::before {
    content:''; position:fixed; inset:0; z-index:99990; pointer-events:none;
    background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3CfeColorMatrix type='saturate' values='0'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    opacity:.16; mix-blend-mode:multiply;
  }
  #main { position:relative; z-index:2; }

  /* LOADER */
  #loader { position:fixed; inset:0; z-index:9999; background:var(--paper); display:flex; flex-direction:column; align-items:center; justify-content:center; transition:opacity 0.8s ease, visibility 0.8s ease; }
  #loader.hide { opacity:0; visibility:hidden; }
  .loader-ring { width:80px; height:80px; border-radius:50%; border:5px dashed var(--ink); animation:spin 2s linear infinite; margin-bottom:28px; position:relative; }
  .loader-ring::before { content:''; position:absolute; inset:9px; border-radius:50%; border:4px dotted var(--red); animation:spin 1.2s linear infinite reverse; }
  @keyframes spin { to{transform:rotate(360deg)} }
  .loader-text { font-family:var(--f-marker); font-size:clamp(1.1rem,4vw,1.5rem); letter-spacing:0.12em; color:var(--ink); background:var(--yellow); padding:2px 12px; rotate:-2deg; animation:textPulse 1.2s ease-in-out infinite; }
  @keyframes textPulse { 0%,100%{opacity:0.5} 50%{opacity:1} }
  .loader-dots { display:flex; gap:10px; margin-top:24px; }
  .loader-dots span { width:12px; height:12px; background:var(--ink); border:2px solid var(--ink); animation:dotBounce 1.2s ease-in-out infinite; }
  .loader-dots span:nth-child(2){animation-delay:0.2s;background:var(--red)}
  .loader-dots span:nth-child(3){animation-delay:0.4s;background:var(--yellow)}
  @keyframes dotBounce { 0%,80%,100%{transform:translateY(0);opacity:0.5} 40%{transform:translateY(-12px);opacity:1} }

  /* TOP NAV */
  .top-nav { display:flex; justify-content:center; padding:18px 20px 0; position:relative; z-index:10; }
  .game-btn { display:inline-flex; align-items:center; gap:7px; font-family:var(--f-cond); font-size:0.85rem; letter-spacing:0.2em; color:var(--ink); border:2.5px solid var(--ink); background:var(--pink); padding:7px 18px; text-decoration:none; box-shadow:3px 3px 0 var(--ink); transition:all 0.15s; }
  .game-btn:hover { transform:translate(-2px,-2px); box-shadow:5px 5px 0 var(--ink); }

  /* HEADER */
  header { text-align:center; padding:clamp(30px,6vw,60px) 20px clamp(20px,4vw,40px); }
  .price-tag { display:inline-block; font-family:var(--f-marker); font-size:clamp(1rem,2.6vw,1.25rem); letter-spacing:0.08em; color:var(--ink); background:var(--yellow); border:2.5px solid var(--ink); padding:6px 22px; box-shadow:4px 4px 0 var(--ink); rotate:3deg; margin-bottom:30px; animation:stickerWobble 3.5s ease-in-out infinite; }
  @keyframes stickerWobble { 0%,100%{rotate:3deg} 50%{rotate:1.5deg} }
  .brand-label { display:inline-block; font-family:var(--f-cond); font-size:clamp(0.8rem,2vw,1rem); letter-spacing:0.38em; color:var(--paper-hi); background:var(--ink); padding:5px 16px 4px 22px; text-transform:uppercase; rotate:-1.5deg; margin-bottom:14px; }
  .hero-title { font-family:var(--f-display); font-size:clamp(4rem,19vw,11rem); font-weight:400; line-height:0.9; letter-spacing:-0.02em; color:var(--ink); text-shadow:0.045em 0.045em 0 var(--red); rotate:-2deg; margin:6px 0 18px; }
  .hero-sub { display:inline-block; font-family:var(--f-type); font-size:clamp(1rem,3vw,1.4rem); letter-spacing:0.35em; color:var(--ink); text-transform:uppercase; border-top:2px solid var(--ink); border-bottom:2px solid var(--ink); padding:5px 16px 5px 22px; margin-bottom:20px; }
  .hero-tagline { font-family:var(--f-marker); font-size:clamp(1rem,2.8vw,1.3rem); letter-spacing:0.08em; color:var(--red); rotate:-1.5deg; text-decoration:underline wavy var(--ink); text-decoration-thickness:1.5px; text-underline-offset:6px; }
  .divider { width:100%; height:5px; max-width:600px; margin:42px auto 0; background:repeating-linear-gradient(90deg,var(--ink) 0 12px,transparent 12px 20px); }

  /* STATS */
  .stats-bar { display:flex; justify-content:center; gap:clamp(14px,4vw,34px); flex-wrap:wrap; padding:34px 20px; }
  .stat-item { text-align:center; background:var(--paper-hi); border:2.5px solid var(--ink); box-shadow:4px 4px 0 var(--ink); padding:10px 20px 8px; min-width:104px; }
  .stat-item:nth-child(odd)  { rotate:-1.5deg; }
  .stat-item:nth-child(even) { rotate:1.2deg; }
  .stat-value { font-family:var(--f-display); font-size:clamp(1.3rem,3.4vw,2rem); font-weight:400; line-height:1.15; color:var(--ink); }
  .stat-item:nth-child(2) .stat-value { color:var(--green); }
  .stat-item:nth-child(3) .stat-value { color:var(--red); }
  .stat-label { font-family:var(--f-cond); font-size:0.8rem; letter-spacing:0.18em; color:var(--ink-soft); text-transform:uppercase; margin-top:4px; }

  /* TOOLS */
  .tools-bar { display:flex; justify-content:center; align-items:stretch; gap:30px; flex-wrap:wrap; padding:12px clamp(16px,4vw,60px) 50px; max-width:1400px; margin:0 auto; }
  .roulette-box, .calc-box { position:relative; border:2.5px solid var(--ink); box-shadow:6px 6px 0 var(--ink); padding:26px 24px 22px; display:flex; flex-direction:column; align-items:center; gap:14px; flex:1; }
  .roulette-box { background:var(--yellow); min-width:300px; max-width:500px; rotate:-0.8deg; }
  .calc-box { background:var(--paper-hi); min-width:260px; max-width:400px; rotate:0.8deg; }
  .roulette-box::before, .calc-box::before { content:''; position:absolute; top:-13px; left:50%; width:88px; height:24px; margin-left:-44px; background:rgba(229,50,45,0.6); border:1px solid rgba(20,18,16,0.15); rotate:-3deg; }
  .calc-box::before { background:rgba(255,111,176,0.65); rotate:3deg; }
  .tool-label { font-family:var(--f-marker); font-size:1rem; letter-spacing:0.12em; color:var(--ink); text-transform:uppercase; }
  #rouletteResult { font-family:var(--f-type); font-size:clamp(1rem,2.4vw,1.2rem); font-weight:700; color:var(--ink); text-align:center; min-height:28px; transition:all 0.3s; }
  #rouletteResult.spinning { animation:rouletteSpin 0.1s linear infinite; color:var(--red); }
  @keyframes rouletteSpin { 0%{opacity:0.3} 50%{opacity:1} 100%{opacity:0.3} }
  #rouletteResult.result { color:var(--yellow); background:var(--ink); padding:2px 12px; animation:resultPop 0.4s cubic-bezier(.17,.67,.3,1.4) forwards; }
  @keyframes resultPop { 0%{transform:scale(0.8) rotate(-3deg)} 100%{transform:scale(1) rotate(-1deg)} }
  .spin-btn { font-family:var(--f-cond); font-size:1.05rem; letter-spacing:0.14em; color:#fff; background:var(--red); border:2.5px solid var(--ink); padding:9px 24px 8px; box-shadow:4px 4px 0 var(--ink); cursor:pointer; transition:all 0.12s; }
  .spin-btn:hover { transform:translate(-2px,-2px); box-shadow:6px 6px 0 var(--ink); }
  .spin-btn:active { transform:translate(3px,3px); box-shadow:1px 1px 0 var(--ink); }
  .spin-btn:disabled { opacity:0.4; cursor:not-allowed; transform:none; box-shadow:4px 4px 0 var(--ink); }
  .qty-controls { display:flex; align-items:center; gap:18px; }
  .qty-btn { width:40px; height:40px; border:2.5px solid var(--ink); background:#fff; color:var(--ink); font-family:var(--f-cond); font-size:1.5rem; line-height:1; cursor:pointer; transition:all 0.12s; display:flex; align-items:center; justify-content:center; box-shadow:3px 3px 0 var(--ink); }
  .qty-btn:hover { background:var(--ink); color:var(--yellow); }
  .qty-btn:active { transform:translate(2px,2px); box-shadow:1px 1px 0 var(--ink); }
  #qtyNum { font-family:var(--f-display); font-size:1.8rem; color:var(--ink); min-width:44px; text-align:center; }
  #calcResult { font-family:var(--f-display); font-size:1.7rem; color:var(--ink); letter-spacing:0.04em; background:linear-gradient(transparent 55%,var(--yellow) 55%); padding:0 8px; }
  .calc-note { font-size:0.8rem; letter-spacing:0.15em; color:var(--ink-soft); }

  /* ROULETTE MODAL */
  #rouletteModal { display:none; position:fixed; inset:0; z-index:8888; background:rgba(20,18,16,0.92); align-items:center; justify-content:center; flex-direction:column; gap:24px; opacity:0; transition:opacity 0.3s ease; }
  #rouletteModal.show { display:flex; }
  #rouletteModal.visible { opacity:1; }
  .modal-inner { width:min(680px,94vw); display:flex; flex-direction:column; align-items:center; gap:22px; }
  .modal-title { font-family:var(--f-marker); font-size:clamp(1rem,3vw,1.4rem); letter-spacing:0.2em; color:var(--ink); background:var(--yellow); padding:3px 16px; rotate:-2deg; }
  #modalStripOuter { position:relative; overflow:hidden; height:120px; border:3px solid var(--paper-hi); background:var(--paper); width:100%; box-shadow:7px 7px 0 var(--red); }
  #modalStripOuter::before,#modalStripOuter::after { content:''; position:absolute; top:0; bottom:0; width:100px; z-index:3; pointer-events:none; }
  #modalStripOuter::before { left:0; background:linear-gradient(90deg,var(--paper),transparent); }
  #modalStripOuter::after  { right:0; background:linear-gradient(-90deg,var(--paper),transparent); }
  #modalMarker { position:absolute; left:50%; top:0; bottom:0; width:4px; background:var(--red); z-index:4; transform:translateX(-50%); }
  #modalMarker::before { content:''; position:absolute; left:50%; top:0; transform:translateX(-50%); width:0; height:0; border-left:9px solid transparent; border-right:9px solid transparent; border-top:13px solid var(--red); }
  #modalMarker::after  { content:''; position:absolute; left:50%; bottom:0; transform:translateX(-50%); width:0; height:0; border-left:9px solid transparent; border-right:9px solid transparent; border-bottom:13px solid var(--red); }
  #modalStrip { display:flex; align-items:center; height:100%; gap:6px; padding:0 4px; will-change:transform; }
  .modal-item { flex-shrink:0; width:130px; height:100px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:5px; border:2px solid var(--ink); background:var(--paper-hi); padding:8px; }
  .modal-item-bar { width:100%; height:6px; background:var(--yellow); border:1.5px solid var(--ink); margin-bottom:4px; }
  .modal-item-name { font-family:var(--f-cond); font-size:14px; letter-spacing:0.04em; text-transform:uppercase; text-align:center; color:var(--ink); line-height:1.25; overflow:hidden; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
  #modalWon { text-align:center; min-height:50px; display:flex; flex-direction:column; align-items:center; gap:6px; }
  #modalWonName { font-family:var(--f-display); font-size:clamp(1.3rem,4.5vw,2rem); color:var(--yellow); text-shadow:3px 3px 0 var(--red); opacity:0; transform:scale(0.7); transition:all 0.5s cubic-bezier(.17,.67,.3,1.4); letter-spacing:0.03em; }
  #modalWonName.show { opacity:1; transform:scale(1); }
  .modal-close-btn { font-family:var(--f-cond); font-size:1rem; letter-spacing:0.2em; color:var(--ink); background:var(--yellow); border:2.5px solid var(--paper-hi); padding:9px 30px 8px; cursor:pointer; box-shadow:4px 4px 0 var(--red); transition:all 0.15s; display:none; }
  .modal-close-btn.show { display:block; }
  .modal-close-btn:hover { transform:translate(-2px,-2px); box-shadow:6px 6px 0 var(--red); }

  .grid-section { padding:0 clamp(16px,4vw,60px) clamp(60px,10vw,120px); max-width:1400px; margin:0 auto; }
  .section-label { display:table; margin:0 auto 38px; font-family:var(--f-cond); font-size:1.1rem; letter-spacing:0.4em; color:var(--paper-hi); background:var(--ink); padding:6px 18px 5px 26px; text-transform:uppercase; rotate:-1deg; }
  .flavour-grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr)); gap:30px 24px; }

  /* LOADING STATE */
  .grid-loading { text-align:center; padding:60px 20px; font-family:var(--f-marker); font-size:1.1rem; letter-spacing:0.15em; color:var(--ink-soft); animation:textPulse 1.2s ease-in-out infinite; grid-column:1/-1; }
  .grid-error { text-align:center; padding:40px 20px; font-family:var(--f-marker); font-size:1rem; letter-spacing:0.08em; color:var(--red); grid-column:1/-1; }

  /* CARDS */
  @keyframes cardIn { from{opacity:0;translate:0 24px;scale:0.95} to{opacity:1;translate:0 0;scale:1} }
  .card { position:relative; background:var(--paper-hi); border:2.5px solid var(--ink); box-shadow:5px 5px 0 var(--ink); padding:26px 20px 22px; transition:transform 0.2s ease, box-shadow 0.2s ease, background 0.2s, rotate 0.2s; cursor:default; opacity:0; animation:cardIn 0.55s ease forwards; }
  .card:nth-child(4n+1) { rotate:-1deg; }
  .card:nth-child(4n+2) { rotate:0.9deg; }
  .card:nth-child(4n+3) { rotate:-0.5deg; }
  .card:nth-child(4n)   { rotate:1.2deg; }
  .card::before { content:''; position:absolute; top:-12px; left:50%; width:62px; height:21px; margin-left:-31px; background:rgba(255,233,77,0.85); border:1px solid rgba(20,18,16,0.15); rotate:-4deg; }
  .card:nth-child(3n+2)::before { rotate:3deg; background:rgba(255,111,176,0.65); }
  .card:nth-child(3n)::before   { rotate:-1deg; background:rgba(36,71,216,0.35); }
  .card:hover { transform:translate(-3px,-4px); rotate:0deg; background:#fff; box-shadow:8px 9px 0 var(--ink); }
  .card.low-stock { border-color:var(--red); box-shadow:5px 5px 0 var(--red); }
  .card.low-stock:hover { box-shadow:8px 9px 0 var(--red); }
  .card.out-of-stock { border-style:dashed; box-shadow:none; background:transparent; }
  .card.out-of-stock.anim-done { opacity:0.45 !important; }
  .card.out-of-stock:hover { transform:none; box-shadow:none; background:transparent; }
  .card.out-of-stock::before { background:rgba(20,18,16,0.12); }
  .card.out-of-stock .card-name { color:var(--ink-soft); text-decoration:line-through; text-decoration-thickness:2px; }
  .card-number { font-family:var(--f-marker); font-size:0.9rem; letter-spacing:0.1em; color:var(--ink-soft); margin-bottom:8px; position:relative; z-index:1; }
  .card-name { font-family:var(--f-cond); font-size:clamp(1.15rem,2.6vw,1.4rem); letter-spacing:0.04em; text-transform:uppercase; color:var(--ink); margin-bottom:18px; line-height:1.2; position:relative; z-index:1; }
  .card-footer { display:flex; align-items:center; justify-content:space-between; position:relative; z-index:1; }
  .stock-dot { width:12px; height:12px; border-radius:50%; flex-shrink:0; border:2px solid var(--ink); }
  .dot-ok  { background:var(--green); }
  .dot-low { background:var(--red); animation:dotBlink 1.4s ease-in-out infinite; }
  .dot-out { background:transparent; border-style:dashed; opacity:0.5; }
  @keyframes dotBlink { 0%,100%{opacity:1} 50%{opacity:0.25} }
  .qty-badge { font-family:var(--f-cond); font-size:0.9rem; letter-spacing:0.14em; padding:4px 14px 3px; background:var(--ink); color:var(--paper-hi); rotate:-2deg; white-space:nowrap; transition:rotate 0.2s; }
  .card:hover .qty-badge { rotate:0deg; }
  .qty-badge.low { background:var(--red); color:#fff; }
  .out-badge { font-family:var(--f-cond); font-size:0.85rem; letter-spacing:0.2em; text-transform:uppercase; padding:4px 12px 3px; border:2px solid var(--ink-soft); color:var(--ink-soft); rotate:-3deg; }
  .card-accent { position:absolute; bottom:0; left:0; right:0; height:7px; background:repeating-linear-gradient(135deg,var(--ink) 0 4px,transparent 4px 8px); opacity:0; transition:opacity 0.25s; }
  .card.low-stock .card-accent { background:repeating-linear-gradient(135deg,var(--red) 0 4px,transparent 4px 8px); }
  .card:hover .card-accent { opacity:1; }
  .card.roulette-pick { background:var(--yellow) !important; border-color:var(--red) !important; box-shadow:8px 8px 0 var(--red) !important; transform:translateY(-6px) scale(1.04) !important; }
  .card.roulette-pick::before { background:rgba(229,50,45,0.6) !important; }

  footer { text-align:center; padding:36px 20px 40px; font-size:0.8rem; letter-spacing:0.18em; color:var(--ink-soft); text-transform:uppercase; position:relative; z-index:2; }
  footer::before { content:'✂ - - - - - - - - - - - - - - - - - - - - - - - - - - - - - - -'; display:block; overflow:hidden; white-space:nowrap; color:var(--ink); margin-bottom:22px; letter-spacing:0.3em; }
  ::-webkit-scrollbar{width:10px} ::-webkit-scrollbar-track{background:var(--paper)} ::-webkit-scrollbar-thumb{background:var(--ink);border:2px solid var(--paper)}
  @media(max-width:480px){.flavour-grid{grid-template-columns:1fr 1fr;gap:26px 14px}.card{padding:22px 14px 18px}.card-name{font-size:1rem}.qty-badge{font-size:0.8rem;padding:3px 9px 2px}.tools-bar{gap:36px}}
  @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:0.01ms !important;animation-iteration-count:1 !important;animation-delay:0s !important}}
</style>
</head>
<body>
<div id="cursor"></div>
<div id="loader">
  <div class="loader-ring"></div>
  <div class="loader-text">Kraunami skoniai</div>
  <div class="loader-dots"><span></span><span></span><span></span></div>
</div>
<canvas id="bgCanvas"></canvas>
<div id="main">
  <div class="top-nav">
  </div>
  <header>
    <div class="price-tag">Kaina: 3.5€</div>
    <div class="brand-label">Premium Liquid</div>
    <h1 class="hero-title">NS40</h1>
    <p class="hero-sub">Skonių sąrašas</p>
    <p class="hero-tagline">◈ &nbsp;REstock 03-22&nbsp; ◈</p>
    <div class="divider"></div>
  </header>
  <div class="stats-bar" id="statsBar"></div>
  <div class="tools-bar">
    <div class="roulette-box">
      <div class="tool-label">◈ Skonių roulette ◈</div>
      <div id="rouletteResult">Spausk ir sužinok!</div>
      <button class="spin-btn" id="spinBtn">🎰 PASIRINK UŽ MANE</button>
    </div>
    <div class="calc-box">
      <div class="tool-label">◈ Kainų skaičiuoklė ◈</div>
      <div class="qty-controls">
        <button class="qty-btn" id="qtyMinus">−</button>
        <div id="qtyNum">1</div>
        <button class="qty-btn" id="qtyPlus">+</button>
      </div>
      <div id="calcResult">3.50€</div>
      <div class="calc-note">vnt × 3.5€</div>
    </div>
  </div>
  <div class="grid-section">
    <p class="section-label">◈ Visi skoniai ◈</p>
    <div class="flavour-grid" id="flavourGrid">
      <div class="grid-loading">Kraunama iš Google Sheets...</div>
    </div>
  </div>
  <footer>NS40 Premium Liquids &nbsp;·&nbsp; Gaminta su meile &nbsp;·&nbsp; 2026 &nbsp;·&nbsp; <a href="admin.html" style="color:rgba(20,18,16,0.25);text-decoration:none;letter-spacing:0.1em;">⚙</a></footer>
</div>

<!-- ROULETTE MODAL -->
<div id="rouletteModal">
  <div class="modal-inner">
    <div class="modal-title">◈ SKONIŲ ROULETTE ◈</div>
    <div id="modalStripOuter">
      <div id="modalMarker"></div>
      <div id="modalStrip"></div>
    </div>
    <div id="modalWon">
      <div id="modalWonName"></div>
    </div>
    <button class="modal-close-btn" id="modalCloseBtn">UŽDARYTI</button>
  </div>
</div>
<script>
const SHEET_ID  = '13rcjuyYF0pMCZJvFNtRLQECkv873dqIlAsR81G4ubMY';
const SHEET_URL = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&cachebust=${Date.now()}`;
const PRICE = 3.5;

let flavours = [];
let inStock  = [];

/* ── Parse CSV ── */
function parseCSV(text) {
  const lines = text.trim().split('\n').map(l => l.trim()).filter(Boolean);
  if (lines.length < 2) return [];
  // skip header row
  return lines.slice(1).map((line, i) => {
    // handle quoted CSV values
    const cols = line.match(/(".*?"|[^,]+)(?=,|$)/g) || line.split(',');
    const name = (cols[0] || '').replace(/"/g, '').trim();
    const qty  = parseInt((cols[1] || '0').replace(/"/g, '').trim(), 10) || 0;
    if (!name) return null;
    return { index: i + 1, name: name.charAt(0).toUpperCase() + name.slice(1), qty };
  }).filter(Boolean);
}

function sortFlavours(list) {
  return [...list].sort((a, b) => {
    if (a.qty === 0 && b.qty > 0) return 1;
    if (a.qty > 0 && b.qty === 0) return -1;
    return 0;
  });
}

/* ── Load from Google Sheets ── */
async function loadFromSheets() {
  try {
    const res  = await fetch(SHEET_URL);
    const text = await res.text();
    flavours = sortFlavours(parseCSV(text));
    inStock  = flavours.filter(f => f.qty > 0);
    renderStats();
    renderGrid(flavours);
    fetchLastUpdated();
  } catch (e) {
    document.getElementById('flavourGrid').innerHTML =
      '<div class="grid-error">⚠ Nepavyko įkelti duomenų.<br>Patikrink ar Sheet\'as viešas.</div>';
  }
}

async function fetchLastUpdated() {
  try {
    const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&cachebust=${Date.now()}`;
    const res  = await fetch(url);
    const text = await res.text();
    const json = JSON.parse(text.match(/google\.visualization\.Query\.setResponse\(([\s\S]*)\)/)[1]);
    if (json && json.status === 'ok') {
      const now = new Date();
      const pad = n => String(n).padStart(2,'0');
      const str = `${pad(now.getDate())}.${pad(now.getMonth()+1)}.${now.getFullYear()} ${pad(now.getHours())}:${pad(now.getMinutes())}`;
      document.getElementById('lastUpdated').textContent = str;
    }
  } catch(e) {
    document.getElementById('lastUpdated').textContent = '—';
  }
}

/* ── Stats ── */
function renderStats() {
  const total = flavours.length, avail = inStock.length;
  document.getElementById('statsBar').innerHTML = `
    <div class="stat-item"><div class="stat-value">${total}</div><div class="stat-label">Viso skonių</div></div>
    <div class="stat-item"><div class="stat-value">${avail}</div><div class="stat-label">Turimų</div></div>
    <div class="stat-item"><div class="stat-value">${total - avail}</div><div class="stat-label">Išparduota</div></div>
    <div class="stat-item"><div class="stat-value" style="font-size:clamp(0.8rem,2vw,1.1rem)" id="lastUpdated">...</div><div class="stat-label">Atnaujinta</div></div>`;
}

/* ── Grid ── */
function stockClass(qty){ return qty===0?'out-of-stock':qty<=2?'low-stock':''; }
function dotClass(qty)  { return qty===0?'dot-out':qty<=2?'dot-low':'dot-ok'; }
function badgeClass(qty){ return (qty>0&&qty<=2)?'low':''; }

function renderGrid(list) {
  const grid = document.getElementById('flavourGrid');
  if (!list.length) { grid.innerHTML = '<div class="grid-error">Sąrašas tuščias</div>'; return; }
  grid.innerHTML = list.map((f, i) => `
    <div class="card ${stockClass(f.qty)}" id="card-${f.index}" style="animation-delay:${i*0.045}s">
      <div class="card-number">#${String(f.index).padStart(2,'0')}</div>
      <div class="card-name">${f.name}</div>
      <div class="card-footer">
        <span class="stock-dot ${dotClass(f.qty)}"></span>
        ${f.qty > 0
          ? `<span class="qty-badge ${badgeClass(f.qty)}">${f.qty}&nbsp;vnt</span>`
          : `<span class="out-badge">Išparduota</span>`}
      </div>
      <div class="card-accent"></div>
    </div>`).join('');
  grid.querySelectorAll('.card.out-of-stock').forEach(c => {
    c.addEventListener('animationend', () => c.classList.add('anim-done'), { once: true });
  });
}

/* ── Roulette (CSGO modal) ── */
const ITEM_W = 136;
const STRIP_COUNT = 60;
let caseSpinning = false;
let lastPick = null;

function buildModalStrip(items) {
  const strip = document.getElementById('modalStrip');
  strip.innerHTML = '';
  items.forEach(f => {
    const div = document.createElement('div');
    div.className = 'modal-item';
    div.innerHTML = `<div class="modal-item-bar"></div><div class="modal-item-name">${f.name}</div>`;
    strip.appendChild(div);
  });
}

function openRouletteModal() {
  if (inStock.length === 0) return;
  const modal = document.getElementById('rouletteModal');
  const wonName = document.getElementById('modalWonName');
  const closeBtn = document.getElementById('modalCloseBtn');
  wonName.className = '';
  wonName.textContent = '';
  closeBtn.className = 'modal-close-btn';
  modal.classList.add('show');
  requestAnimationFrame(() => modal.classList.add('visible'));

  const winnerIdx = 44 + Math.floor(Math.random() * 8);
  const chosen = inStock[Math.floor(Math.random() * inStock.length)];
  const items = Array.from({length: STRIP_COUNT}, (_, i) => i === winnerIdx ? chosen : inStock[Math.floor(Math.random() * inStock.length)]);
  buildModalStrip(items);

  const strip = document.getElementById('modalStrip');
  const outer = document.getElementById('modalStripOuter');
  const centerOffset = outer.offsetWidth / 2;
  const targetX = -(winnerIdx * ITEM_W + ITEM_W / 2 - centerOffset) + (Math.random() * 60 - 30);

  strip.style.transition = 'none';
  strip.style.transform  = 'translateX(0)';

  requestAnimationFrame(() => requestAnimationFrame(() => {
    const dur = 4200 + Math.random() * 1500;
    strip.style.transition = `transform ${dur}ms cubic-bezier(0.05,0.8,0.3,1)`;
    strip.style.transform  = `translateX(${targetX}px)`;

    setTimeout(() => {
      wonName.textContent = chosen.name;
      wonName.classList.add('show');
      closeBtn.classList.add('show');
      caseSpinning = false;
      document.getElementById('spinBtn').disabled = false;

      setTimeout(() => {
        closeModal(chosen);
      }, 2200);
    }, dur + 200);
  }));
}

function closeModal(chosen) {
  const modal = document.getElementById('rouletteModal');
  modal.classList.remove('visible');
  setTimeout(() => {
    modal.classList.remove('show');
    if (chosen) {
      if (lastPick) document.getElementById('card-' + lastPick)?.classList.remove('roulette-pick');
      lastPick = chosen.index;
      const card = document.getElementById('card-' + chosen.index);
      if (card) { card.classList.add('roulette-pick'); card.scrollIntoView({ behavior:'smooth', block:'center' }); }
      const r = document.getElementById('rouletteResult');
      r.textContent = chosen.name;
      r.className = 'result';
    }
  }, 300);
}

document.getElementById('spinBtn').addEventListener('click', () => {
  if (caseSpinning || inStock.length === 0) return;
  caseSpinning = true;
  document.getElementById('spinBtn').disabled = true;
  openRouletteModal();
});

document.getElementById('modalCloseBtn').addEventListener('click', () => {
  const wonName = document.getElementById('modalWonName');
  const chosen = wonName.textContent ? inStock.find(f => f.name === wonName.textContent) || null : null;
  closeModal(chosen);
});

document.getElementById('rouletteModal').addEventListener('click', e => {
  if (e.target === document.getElementById('rouletteModal') && !caseSpinning) {
    const wonName = document.getElementById('modalWonName');
    const chosen = wonName.textContent ? inStock.find(f => f.name === wonName.textContent) || null : null;
    closeModal(chosen);
  }
});

/* ── Calc ── */
let qty = 1;
function updateCalc() {
  document.getElementById('qtyNum').textContent = qty;
  document.getElementById('calcResult').textContent = (qty * PRICE).toFixed(2) + '€';
}
document.getElementById('qtyPlus').addEventListener('click',  () => { if(qty < 99){ qty++; updateCalc(); } });
document.getElementById('qtyMinus').addEventListener('click', () => { if(qty > 1){ qty--; updateCalc(); } });

/* ── Loader ── */
window.addEventListener('load', () => setTimeout(() => document.getElementById('loader').classList.add('hide'), 2200));

/* ── BG Canvas ── */
const canvas = document.getElementById('bgCanvas'), ctx = canvas.getContext('2d');
function resize(){ canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
resize(); window.addEventListener('resize', resize);
const COLORS = ['#00f5ff','#bf00ff','#ff0080','#0057ff'];
const particles = Array.from({length:70}, () => ({ x:Math.random()*window.innerWidth, y:Math.random()*window.innerHeight, r:Math.random()*1.5+0.3, vx:(Math.random()-.5)*.3, vy:(Math.random()-.5)*.3-.15, color:COLORS[Math.floor(Math.random()*COLORS.length)], alpha:Math.random()*.6+.2, pulse:Math.random()*Math.PI*2 }));
const smokes = Array.from({length:8}, () => ({ x:Math.random()*window.innerWidth, y:Math.random()*window.innerHeight, r:Math.random()*200+100, vx:(Math.random()-.5)*.12, vy:-(Math.random()*.15+.05), alpha:Math.random()*.03+.01, phase:Math.random()*Math.PI*2 }));
function drawBg(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  let g=ctx.createRadialGradient(canvas.width*.2,canvas.height*.3,0,canvas.width*.2,canvas.height*.3,canvas.width*.55);
  g.addColorStop(0,'rgba(0,87,255,0.04)');g.addColorStop(1,'transparent');ctx.fillStyle=g;ctx.fillRect(0,0,canvas.width,canvas.height);
  g=ctx.createRadialGradient(canvas.width*.8,canvas.height*.7,0,canvas.width*.8,canvas.height*.7,canvas.width*.5);
  g.addColorStop(0,'rgba(191,0,255,0.04)');g.addColorStop(1,'transparent');ctx.fillStyle=g;ctx.fillRect(0,0,canvas.width,canvas.height);
  smokes.forEach(s=>{s.x+=s.vx;s.y+=s.vy;s.phase+=.003;if(s.y+s.r<0){s.y=canvas.height+s.r;s.x=Math.random()*canvas.width;}const sg=ctx.createRadialGradient(s.x,s.y,0,s.x,s.y,s.r);sg.addColorStop(0,`rgba(0,245,255,${s.alpha*(.8+.2*Math.sin(s.phase))})`);sg.addColorStop(1,'transparent');ctx.fillStyle=sg;ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill();});
  particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.pulse+=.04;if(p.y<-10){p.y=canvas.height+10;p.x=Math.random()*canvas.width;}if(p.x<-10)p.x=canvas.width+10;if(p.x>canvas.width+10)p.x=-10;const a=p.alpha*(.6+.4*Math.sin(p.pulse));ctx.save();ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.shadowBlur=12;ctx.shadowColor=p.color;ctx.globalAlpha=a;ctx.fillStyle=p.color;ctx.fill();ctx.restore();});
  requestAnimationFrame(drawBg);
}
drawBg();

/* ── Cursor Trail ── */
const cursorEl = document.getElementById('cursor');
const trailColors = ['#00f5ff','#bf00ff','#ff0080','#0057ff'];
const trailPool = [];
const TRAIL_COUNT = 18;
for(let i=0;i<TRAIL_COUNT;i++){
  const t=document.createElement('div'); t.className='trail';
  const size=Math.max(3,10-i*0.4);
  t.style.cssText=`width:${size}px;height:${size}px;opacity:0;background:${trailColors[i%4]};box-shadow:0 0 ${size*1.5}px ${trailColors[i%4]};`;
  document.body.appendChild(t); trailPool.push({el:t});
}
let mouseX=0, mouseY=0;
const trailPositions = Array(TRAIL_COUNT).fill(null).map(()=>({x:0,y:0}));
document.addEventListener('mousemove', e=>{ mouseX=e.clientX; mouseY=e.clientY; cursorEl.style.left=mouseX+'px'; cursorEl.style.top=mouseY+'px'; });
(function animateTrail(){
  trailPositions.unshift({x:mouseX,y:mouseY}); trailPositions.pop();
  trailPool.forEach((t,i)=>{
    const pos=trailPositions[i];
    t.el.style.left=pos.x+'px'; t.el.style.top=pos.y+'px';
    t.el.style.opacity=Math.max(0,(1-i/TRAIL_COUNT)*0.7);
    t.el.style.transform=`translate(-50%,-50%) scale(${Math.max(0.3,1-i/TRAIL_COUNT)})`;
  });
  requestAnimationFrame(animateTrail);
})();

/* ── KONAMI CODE → ADMIN ── */
const KONAMI = ['ArrowUp','ArrowUp','ArrowDown','ArrowDown','ArrowLeft','ArrowRight','ArrowLeft','ArrowRight'];
let konamiIdx = 0;
document.addEventListener('keydown', e => {
  if (e.key === KONAMI[konamiIdx]) {
    konamiIdx++;
    if (konamiIdx === KONAMI.length) {
      konamiIdx = 0;
      // flash effect before redirect
      document.body.style.transition = 'filter 0.3s';
      document.body.style.filter = 'brightness(3)';
      setTimeout(() => { window.location.href = 'admin.html'; }, 300);
    }
  } else {
    konamiIdx = 0;
  }
});

/* ── START ── */
loadFromSheets();

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('service-worker.js');
}
</script>
</body>
</html>
