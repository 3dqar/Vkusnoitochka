<!doctype html><html lang="lt"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#e9eff2"><title>3DQA — Arctic</title><link rel="stylesheet" href="winter.css"></head><body><main><nav><strong>3DQA.</strong><button id="snowToggle">❄ Sniegas</button></nav><header><svg viewBox="0 0 1000 300" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><path fill="#a9c1cf" d="M0 250L200 100 340 230 550 45 730 210 870 60 1000 210V300H0Z"/><path fill="#f7fafb" d="M420 160L550 45 730 210 567 115 530 140 500 110Z M790 145L870 60 1000 210 880 120 850 145Z"/><path fill="#eaf2f6" d="M0 270Q300 220 600 265T1000 245V300H0Z"/></svg><h1>3DQA.</h1></header><section id="entries" class="grid"></section><p id="status" role="status"></p><footer>© 2026 3DQA</footer></main><script src="winter.js"></script><script>const SHEET_ID=''; const status=document.querySelector('#status');async function load(){if(!SHEET_ID){status.textContent='Duomenų šaltinis dar neprijungtas.';return}try{const r=await fetch('https://docs.google.com/spreadsheets/d/'+encodeURIComponent(SHEET_ID)+'/gviz/tq?tqx=out:json&headers=1&sheet=Winter');if(!r.ok)throw Error();const t=await r.text(),v=JSON.parse(t.slice(t.indexOf('{'),t.lastIndexOf('}')+1));const cards=document.querySelector('#entries');cards.replaceChildren();for(const row of v.table.rows){const name=row.c[0]?.v;if(!name)continue;const a=document.createElement('article');a.className='card';const h=document.createElement('h2');h.textContent=name;a.append(h);if(row.c[1]?.v){const p=document.createElement('p');p.textContent=row.c[1].v;a.append(p)}cards.append(a)}status.textContent=''}catch{status.textContent='Nepavyko įkelti duomenų.'}}load();</script></body></html>
